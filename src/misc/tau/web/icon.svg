<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
<!-- The icon of Tau: a tau between angle brackets, bold and slanted as in a
     sans serif font for mathematics, light on a dark frame with rounded
     corners: the brackets with a cool hue, the tau with a warm one, the
     frame a dark slate with the grid of technical paper. The shapes are drawn (no font is needed); they
     stand a little above the frame: a side under them, and their shadow. -->
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#414a63"/>
    <stop offset="1" stop-color="#1b1e2a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
    <stop offset="0" stop-color="#8aa0e8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#8aa0e8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f8ff"/>
    <stop offset="1" stop-color="#b9cdf6"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf5"/>
    <stop offset="1" stop-color="#ffd993"/>
  </linearGradient>
  <!-- the paper of a drawing office: a fine grid, a stronger line each fourth -->
  <pattern id="fine" width="31" height="31" patternUnits="userSpaceOnUse" x="8" y="8">
    <path d="M31 0H0V31" fill="none" stroke="#cfd9ff" stroke-opacity="0.10" stroke-width="1"/>
  </pattern>
  <pattern id="coarse" width="124" height="124" patternUnits="userSpaceOnUse" x="8" y="8">
    <path d="M124 0H0V124" fill="none" stroke="#cfd9ff" stroke-opacity="0.20" stroke-width="1.6"/>
  </pattern>
  <clipPath id="inside"><rect x="8" y="8" width="496" height="496" rx="104"/></clipPath>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <g id="brackets" transform="translate(-42 20) scale(0.8)">
    <path d="M130 62 L188 62 L122 288 L188 512 L130 512 L62 288 Z" transform="translate(40 0)"/>
    <path d="M614 62 L556 62 L622 288 L556 512 L614 512 L682 288 Z" transform="translate(-40 0)"/>
  </g>
  <g id="tau" transform="translate(-42 20) scale(0.8)">
    <path d="M262 168 L500 168 L488 226 L246 226 Z"/>
    <path d="M338 220 L412 220 L378 352 C374 368 380 376 396 374 L412 372 L402 424
             C380 430 352 432 330 428 C296 422 284 398 292 370 Z"/>
  </g>
</defs>
<!-- the frame, with a lighter edge at the top and a dark one around -->
<rect x="8" y="8" width="496" height="496" rx="104" fill="url(#frame)"/>
<g clip-path="url(#inside)">
  <rect x="8" y="8" width="496" height="496" fill="url(#fine)"/>
  <rect x="8" y="8" width="496" height="496" fill="url(#coarse)"/>
</g>
<rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>
<rect x="9.5" y="9.5" width="493" height="493" rx="102.5" fill="none" stroke="#c8d4ff" stroke-opacity="0.16" stroke-width="3"/>
<rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#0e1018" stroke-width="2"/>
<!-- the shadow, the side and the face of the glyphs -->
<g fill="#000000" opacity="0.7" filter="url(#soft)" transform="translate(0 28)">
  <use xlink:href="#brackets" href="#brackets"/><use xlink:href="#tau" href="#tau"/>
</g>
<!-- (a border around each glyph, its side included: dark, in its hue) -->
<g fill="#1a2750" stroke="#1a2750" stroke-width="15" stroke-linejoin="round">
  <use xlink:href="#brackets" href="#brackets"/><use xlink:href="#brackets" href="#brackets" transform="translate(0 6)"/>
  <use xlink:href="#brackets" href="#brackets" transform="translate(0 13)"/>
</g>
<g fill="#5b3407" stroke="#5b3407" stroke-width="15" stroke-linejoin="round">
  <use xlink:href="#tau" href="#tau"/><use xlink:href="#tau" href="#tau" transform="translate(0 6)"/>
  <use xlink:href="#tau" href="#tau" transform="translate(0 13)"/>
</g>
<use xlink:href="#brackets" href="#brackets" fill="#4f6396" stroke="#4f6396" stroke-width="2" stroke-linejoin="round" transform="translate(0 13)"/>
<use xlink:href="#brackets" href="#brackets" fill="#7f95cf" transform="translate(0 6)"/>
<use xlink:href="#brackets" href="#brackets" fill="url(#cool)"/>
<use xlink:href="#tau" href="#tau" fill="#a8742a" stroke="#a8742a" stroke-width="2" stroke-linejoin="round" transform="translate(0 13)"/>
<use xlink:href="#tau" href="#tau" fill="#d9a04a" transform="translate(0 6)"/>
<use xlink:href="#tau" href="#tau" fill="url(#warm)"/>
</svg>
