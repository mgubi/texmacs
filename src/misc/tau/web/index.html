<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tau</title>
<style>
:root {
	--bar: #ececf0; --bar-border: #c4c4cf; --text: #1e1e28; --dim: #70707e;
	--hover: #d9d9e3; --pressed: #c3c8e6; --popup: #fafafc; --accent: #3355bb;
}
html, body { height: 100%; margin: 0; background: #6e6e91; overflow: hidden; }
body { display: flex; flex-direction: column; font: 13px/1.3 system-ui, sans-serif; color: var(--text);
       user-select: none; -webkit-user-select: none; }
.tau-bar { display: flex; flex-wrap: nowrap; overflow: auto; scrollbar-width: none; align-items: center; background: var(--bar);
           border-bottom: 1px solid var(--bar-border); padding: 1px 4px; min-height: 0; }
.tau-bar:empty, .tau-bar[hidden] { display: none; }
.tau-bar::-webkit-scrollbar, .tau-popup::-webkit-scrollbar, .tau-doc-tabs::-webkit-scrollbar { display: none; }
.tau-bar > .tau-entry, .tau-bar > .tau-vsep, .tau-bar > .tau-text, .tau-bar > .tau-group { flex: none; }
/* what does not fit scrolls, with a chevron at each end where there is more
   (fit, chrome.mjs): the chevrons hang on items of no size which stick to
   the ends */
.tau-chev { position: sticky; flex: none; width: 0; align-self: stretch; z-index: 3; pointer-events: none; }
.tau-chev-prev { left: 0; }
.tau-chev-next { right: 0; }
.tau-chevron { position: absolute; top: 0; bottom: 0; width: 16px; display: none; align-items: center; justify-content: center;
	pointer-events: auto; font: inherit; font-size: 13px; line-height: 1; color: var(--text); background: var(--bar);
	border: 0; padding: 0; opacity: 0.94; }
.tau-chevron:hover { background: var(--hover); }
.tau-chev-prev > .tau-chevron { left: 0; box-shadow: 4px 0 4px -2px rgba(0,0,0,0.18); }
.tau-chev-next > .tau-chevron { right: 0; box-shadow: -4px 0 4px -2px rgba(0,0,0,0.18); }
.tau-chev.tau-shown > .tau-chevron { display: flex; }
.tau-fit-column > .tau-chev { width: auto; height: 0; }
.tau-fit-column > .tau-chev-prev { left: auto; top: 0; }
.tau-fit-column > .tau-chev-next { right: auto; bottom: 0; }
.tau-fit-column > .tau-chev > .tau-chevron { left: 0; right: 0; width: auto; height: 14px; font-size: 10px; }
.tau-fit-column > .tau-chev-prev > .tau-chevron { top: 0; bottom: auto; box-shadow: 0 4px 4px -2px rgba(0,0,0,0.18); }
.tau-fit-column > .tau-chev-next > .tau-chevron { top: auto; bottom: 0; box-shadow: 0 -4px 4px -2px rgba(0,0,0,0.18); }
.tau-popup > .tau-chev > .tau-chevron { background: var(--popup); }
#tau-menu { padding: 0 4px; }
.tau-entry { font: inherit; color: inherit; background: none; border: 0; border-radius: 4px;
             padding: 3px 7px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tau-entry:disabled { opacity: 0.4; }
.tau-entry:hover:not(:disabled), .tau-entry.tau-open { background: var(--hover); }
.tau-entry.tau-pressed { background: var(--pressed); }
.tau-bar .tau-entry { padding: 3px 5px; }
#tau-menu .tau-entry { padding: 4px 8px; }
.tau-icon { height: 20px; min-width: 12px; display: block; }
#tau-icons-1 .tau-icon, #tau-icons-2 .tau-icon, #tau-icons-3 .tau-icon { height: 17px; }
.tau-arrow { font-size: 9px; color: var(--dim); }
.tau-vsep { width: 1px; align-self: stretch; margin: 3px 4px; background: var(--bar-border); }
.tau-glue { flex: 1; }
.tau-group { color: var(--dim); font-size: 11px; padding: 4px 8px 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.tau-text { padding: 3px 8px; }
.tau-symbol { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", serif; font-size: 15px; }
.tau-color { display: inline-block; width: 16px; height: 16px; border: 1px solid var(--bar-border); }
.tau-popup { position: fixed; z-index: 100000; background: var(--popup); border: 1px solid var(--bar-border);
             border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); padding: 4px; overflow-y: auto; scrollbar-width: none;
             display: flex; flex-direction: column; min-width: 120px; }
.tau-popup > .tau-entry { justify-content: flex-start; border-radius: 4px; padding: 4px 8px 4px 4px; text-align: left; }
.tau-popup > .tau-entry:hover:not(:disabled), .tau-popup > .tau-entry.tau-open { background: var(--accent); color: #fff; }
.tau-popup > .tau-entry:hover .tau-arrow, .tau-popup > .tau-entry:hover .tau-shortcut { color: #dde; }
.tau-check { width: 14px; text-align: center; font-size: 11px; flex: none; }
.tau-shortcut { margin-left: auto; padding-left: 24px; color: var(--dim); font-size: 12px; }
.tau-hsep { height: 1px; margin: 4px 2px; background: var(--bar-border); flex: none; }
.tau-tile { display: grid; gap: 1px; padding: 2px; }
.tau-tile .tau-entry { justify-content: center; padding: 3px 4px; }
/* Between the menu bar and the footer: the icon bars, then the views with
   their tools. The main and the mode icon bars are rows above the views, or
   (body.tau-bars-left, the preference "icon bars") two columns at their
   left, from the menu bar down to the footer. */
#tau-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr);
	grid-template-rows: auto auto auto auto minmax(0, 1fr); }
#tau-middle { min-height: 0; min-width: 0; display: flex; grid-row: 5; }
.tau-bars-left #tau-body { grid-template-columns: auto auto minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
.tau-bars-left #tau-icons-0 { grid-column: 1; grid-row: 1 / 4; }
.tau-bars-left #tau-icons-1 { grid-column: 2; grid-row: 1 / 4; }
.tau-bars-left #tau-icons-2 { grid-column: 3; grid-row: 1; }
.tau-bars-left #tau-icons-3 { grid-column: 3; grid-row: 2; }
.tau-bars-left #tau-middle { grid-column: 3; grid-row: 3; }
.tau-bars-left #tau-icons-0, .tau-bars-left #tau-icons-1 { flex-direction: column; flex-wrap: nowrap;
	align-items: stretch; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 2px;
	border-bottom: 0; border-right: 1px solid var(--bar-border); }
.tau-bars-left #tau-icons-0 .tau-entry, .tau-bars-left #tau-icons-1 .tau-entry { justify-content: center; flex: none; padding: 4px 4px; }
.tau-bars-left #tau-icons-0 .tau-vsep, .tau-bars-left #tau-icons-1 .tau-vsep { width: auto; height: 1px; margin: 4px 3px; flex: none; }
.tau-bars-left #tau-icons-1 .tau-icon { height: 17px; }
.tau-bars-left #tau-icons-0 .tau-arrow, .tau-bars-left #tau-icons-1 .tau-arrow { display: none; }
.tau-divider { flex: none; width: 5px; margin: 0 -2px; z-index: 2; cursor: col-resize; background: transparent; }
.tau-divider:hover, .tau-divider.tau-dragging { background: var(--accent); opacity: 0.5; }
#tau-center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#tau-panes { flex: 1; min-height: 0; display: flex; }
.tau-tool { background: var(--popup); overflow: auto; display: flex; flex-direction: column; }
.tau-tool[hidden], .tau-tool:empty { display: none; }
.tau-side { width: 300px; border-left: 1px solid var(--bar-border); padding: 4px; }
#tau-side-1 { border-left: 0; border-right: 1px solid var(--bar-border); }
.tau-bottom { max-height: 40%; border-top: 1px solid var(--bar-border); padding: 4px; }
.tau-embedded { display: block; flex: none; outline: none; }
.tau-embedded.tau-fill { flex: 1; width: 100%; min-height: 120px; }
.tau-embedded.tau-editable { border: 1px solid var(--bar-border); cursor: text; }
.tau-keyboard { position: fixed; left: 0; top: 0; width: 2px; height: 18px; padding: 0; border: 0; margin: 0; opacity: 0;
	resize: none; overflow: hidden; white-space: pre; font-size: 16px; line-height: 1; pointer-events: none; z-index: -1; }
.tau-pane { flex: 1 1 0; min-width: 80px; display: flex; flex-direction: column; }
.tau-pane + .tau-pane { border-left: 1px solid var(--bar-border); }
.tau-view { flex: 1; min-height: 0; position: relative; }
.tau-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: text; }
.tau-no-header #tau-menu, .tau-no-header #tau-icons-0, .tau-no-header #tau-icons-1,
.tau-no-header #tau-icons-2, .tau-no-header #tau-icons-3 { display: none; }
.tau-fullscreen .tau-doc-tabs, .tau-fullscreen .tau-scroll { display: none; }
.tau-tooltip { position: fixed; z-index: 150000; background: #fffff0; border: 1px solid var(--bar-border);
	border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); padding: 2px; pointer-events: none; }
.tau-tool-grip { flex: none; width: 5px; margin: 0 -2px; z-index: 2; cursor: col-resize; }
.tau-tool-grip[hidden] { display: none; }
.tau-tool-grip:hover { background: var(--accent); opacity: 0.5; }
.tau-side { flex: none; }
.tau-scroll { position: absolute; z-index: 1; opacity: 0.55; transition: opacity 0.15s; }
.tau-scroll[hidden] { display: none; }
.tau-scroll:hover, .tau-scroll.tau-dragging { opacity: 1; }
.tau-scroll-y { top: 2px; bottom: 12px; right: 2px; width: 9px; }
.tau-scroll-x { left: 2px; right: 12px; bottom: 2px; height: 9px; }
.tau-thumb { position: absolute; left: 0; top: 0; background: rgba(60, 60, 80, 0.55); border-radius: 5px; }
.tau-scroll-y .tau-thumb { width: 100%; }
.tau-scroll-x .tau-thumb { height: 100%; }
.tau-doc-tabs { display: flex; align-items: stretch; background: var(--bar); border-bottom: 1px solid var(--bar-border);
	padding: 3px 4px 0; gap: 2px; overflow: auto; scrollbar-width: none; min-height: 24px; flex: none; }
.tau-doc-tab { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border: 1px solid transparent;
	border-bottom: 0; border-radius: 5px 5px 0 0; color: var(--dim); min-width: 40px; max-width: 220px; cursor: default; }
.tau-doc-tab:hover { background: var(--hover); }
.tau-doc-tab.tau-current { background: var(--popup); border-color: var(--bar-border); color: var(--text); }
.tau-pane.tau-active .tau-doc-tab.tau-current { box-shadow: inset 0 2px 0 var(--accent); }
.tau-doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tau-doc-close, .tau-doc-button { font: inherit; line-height: 1; color: var(--dim); background: none; border: 0;
	border-radius: 4px; padding: 1px 5px; }
.tau-doc-close:hover, .tau-doc-button:hover { background: var(--pressed); color: var(--text); }
.tau-doc-button { align-self: center; font-size: 15px; }
.tau-notice { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #fff4c2; color: #4a3b00;
	border-bottom: 1px solid #e0cf7a; font-size: 12px; }
.tau-notice span { flex: 1; }
.tau-veil { position: fixed; inset: 0; z-index: 200000; background: rgba(30, 30, 40, 0.45); display: flex;
	align-items: center; justify-content: center; }
.tau-failure { max-width: 460px; background: var(--popup); border: 1px solid var(--bar-border); border-radius: 8px;
	box-shadow: 0 8px 30px rgba(0,0,0,0.35); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.tau-failure-title { font-weight: 600; font-size: 15px; }
.tau-failure .tau-button { align-self: flex-end; }
.tau-ask { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); z-index: 100001; display: flex;
	align-items: center; gap: 8px; padding: 10px 14px; background: var(--popup); border: 1px solid var(--bar-border);
	border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.tau-dialog { position: fixed; transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 16px);
	max-height: calc(100vh - 16px); display: flex; flex-direction: column; background: var(--popup);
	border: 1px solid var(--bar-border); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); outline: none; }
.tau-dialog-title { display: flex; align-items: center; padding: 5px 6px 5px 12px; background: var(--bar);
	border-bottom: 1px solid var(--bar-border); border-radius: 8px 8px 0 0; cursor: default; user-select: none; }
.tau-dialog-name { flex: 1; font-weight: 600; }
.tau-dialog-close { font: inherit; font-size: 16px; line-height: 1; color: var(--dim); background: none; border: 0;
	border-radius: 4px; padding: 1px 6px; }
.tau-dialog-close:hover { background: var(--hover); }
.tau-dialog-body { overflow: auto; padding: 4px; }
.tau-v { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
.tau-h { display: flex; flex-direction: row; align-items: center; min-width: 0; }
.tau-refreshable { display: contents; }
.tau-space { flex: none; }
.tau-vline { width: 1px; align-self: stretch; margin: 0 4px; background: var(--bar-border); }
.tau-dialog-text { padding: 2px 4px; }
.tau-dialog-group { font-weight: 600; padding: 6px 4px 2px; }
.tau-aligned { display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-items: center; }
.tau-aligned-left { justify-content: flex-end; }
.tau-button { font: inherit; color: inherit; background: var(--bar); border: 1px solid var(--bar-border);
	border-radius: 5px; padding: 3px 14px; margin: 0 3px; display: inline-flex; align-items: center; gap: 4px; }
.tau-button:hover:not(:disabled) { background: var(--hover); }
.tau-button:disabled { opacity: 0.4; }
.tau-dialog .tau-entry { padding: 3px 6px; }
.tau-input-wrap { display: inline-flex; min-width: 4em; }
.tau-input, .tau-enum, .tau-choice { font: inherit; color: inherit; background: var(--field, #fff);
	border: 1px solid var(--bar-border); border-radius: 4px; padding: 2px 5px; min-width: 0; }
.tau-input { flex: 1; width: 100%; box-sizing: border-box; }
.tau-choice { padding: 0; }
.tau-setting { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.tau-setting-label { flex: 1; }
.tau-box { border: 1px solid var(--bar-border); border-radius: 6px; margin: 6px 4px; padding: 4px 8px 6px;
	display: flex; flex-direction: column; }
.tau-box legend { color: var(--dim); font-size: 12px; padding: 0 4px; }
.tau-tabs { display: flex; flex-direction: column; }
.tau-tab-strip { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px 4px 0; border-bottom: 1px solid var(--bar-border); }
.tau-tab { font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px solid transparent;
	padding: 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
.tau-tab:hover { background: var(--hover); }
.tau-tab.tau-current { border-bottom-color: var(--accent); }
.tau-tab-page { padding: 6px 4px; }
.tau-tab-page[hidden] { display: none; }
.tau-scrollable { overflow: auto; max-height: 60vh; }
.tau-unsupported { color: var(--dim); font-size: 12px; padding: 2px 4px; }
#tau-footer { display: flex; gap: 16px; padding: 2px 8px; background: var(--bar); border-top: 1px solid var(--bar-border);
              font-size: 12px; min-height: 16px; white-space: nowrap; }
#tau-footer[hidden] { display: none; }
#tau-footer-left, #status { overflow: hidden; text-overflow: ellipsis; }
#tau-footer-right { margin-left: auto; color: var(--dim); }
#status { color: var(--dim); }
</style>
</head>
<body class="tau-bars-left">
<div id="tau-menu" class="tau-bar"></div>
<div id="tau-body">
<div id="tau-icons-0" class="tau-bar"></div>
<div id="tau-icons-1" class="tau-bar"></div>
<div id="tau-icons-2" class="tau-bar"></div>
<div id="tau-icons-3" class="tau-bar"></div>
<div id="tau-middle">
<div id="tau-side-1" class="tau-tool tau-side" hidden></div>
<div id="tau-center">
<div id="tau-panes"></div>
<div id="tau-bottom-0" class="tau-tool tau-bottom" hidden></div>
<div id="tau-bottom-1" class="tau-tool tau-bottom" hidden></div>
</div>
<div id="tau-side-0" class="tau-tool tau-side" hidden></div>
</div>
</div>
<div id="tau-footer"><span id="tau-footer-left"></span><span id="status">Loading Tau…</span><span id="tau-footer-right"></span></div>
<script type="module" src="tau.mjs"></script>
</body>
</html>
