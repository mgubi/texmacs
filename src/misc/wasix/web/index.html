<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeXmacs on WASIX</title>
<style>
  :root { --bg: #9a9a9a; --fg: #222; --panel: #f4f4f4; --muted: #666; --accent: #2a5db0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #3a3a3a; --fg: #ddd; --panel: #222; --muted: #999; --accent: #7aa7f0; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #screen { display: block; outline: none; cursor: default; image-rendering: auto; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 14px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  #loading div { background: var(--panel); padding: 20px 28px; border-radius: 8px; max-width: 80vw; }
  #loading h1 { font-size: 16px; margin: 0 0 6px; }
  #loading p { margin: 0; color: var(--muted); white-space: pre-wrap; }
  #loading.gone { display: none; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="loading"><div><h1>TeXmacs on WASIX</h1><p id="status">loading…</p></div></div>
<script type="module" src="texmacs-gui.js"></script>
</body>
</html>
