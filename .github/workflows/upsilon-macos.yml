# TeXmacs of the branch upsilon_texmacs for macOS 13 and later, with S7, as
# two disk images for Apple silicon and Intel: the native interface of
# macOS (Cocoa, src/docs/ns-port.md) and the Vue port (SDL3 and Clay, drawn by
# the GPU with OpenGL and ThorVG, src/docs/vue-graphics-stack.md):
#   * deps (for arm64 and x86_64, the latter under Rosetta): the libraries
#     which do not come with macOS (libpng, FreeType, SDL3, SDL3_ttf,
#     MuPDF, ThorVG) built for macOS 13 with packages/macos/build-deps.sh
#     (cached, until it, misc/thorvg/build-thorvg.sh or the version of
#     macOS change; S7 is in the sources);
#   * gs (for arm64 and x86_64): Ghostscript, the program gs which TeXmacs
#     runs for EPS and PostScript, built for macOS 13 with
#     packages/build-gs.sh (cached; self-contained: fonts and resources
#     built in), into every application (#662);
#   * app (for each interface and architecture): TeXmacs.app with
#     packages/macos/build-ns-app.sh;
#   * dmg (for each interface): both applications merged
#     (packages/macos/merge-universal.sh) under the name and the identity of
#     Upsilon (packages/macos/upsilon-identity.sh: "TeXmacs Upsilon.app" for
#     Cocoa, "TeXmacs Upsilon Vue.app", beside the stock TeXmacs.app), its
#     disk image, and a check that
#     the application of the disk image opens a document given on the
#     command line with each architecture and shows its colors
#     (packages/macos/ci-colors.tm, png-has-red.py). The disk images and
#     the snapshots of the windows are artifacts of the run;
#   * release (on upsilon_ci only): both disk images published as the
#     pre-release upsilon-latest of the repository, replaced at each build
#     (its tag moved to the commit built):
#     https://github.com/<owner>/<repo>/releases/tag/upsilon-latest
#   * qt: the Qt 6 interface, with S7, for Apple silicon and the libraries
#     of Homebrew (the job of ci.yml): built, the regression suites run,
#     and "TeXmacs Upsilon Qt.app" (deployed with macdeployqt) kept as an artifact of
#     the run. It is on its own: not in the disk images nor in the release.
#
# The applications are signed ad hoc and not notarized: Gatekeeper rejects
# them on another machine until the quarantine is removed,
#   xattr -dr com.apple.quarantine "/Applications/TeXmacs Upsilon.app"
#
# It runs on the branch upsilon_ci only: a state of upsilon_texmacs is built by
# moving upsilon_ci to it,
#   git push -f origin upsilon_texmacs:upsilon_ci
# (or by hand, from the Actions tab, on any branch)

name: macOS (upsilon_texmacs, Cocoa, Vue and Qt)

on:
  push:
    branches: [upsilon_ci]
  workflow_dispatch:

env:
  MIN_MACOS: "13.0"

jobs:
  deps:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - name: Place of the libraries
        run: echo "DEPS=$RUNNER_TOOL_CACHE/texmacs-deps-maxs-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Cache of the libraries
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS }}
          key: texmacs-deps-maxs-${{ matrix.arch }}-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/macos/build-deps.sh', 'src/misc/thorvg/build-thorvg.sh') }}

      - name: Libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: packages/macos/build-deps.sh "$DEPS" ${{ matrix.arch }} "$MIN_MACOS" vue,tls

  # Ghostscript for each architecture, in a cache of its own (its sources
  # and its build do not depend on the other libraries)
  gs:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - name: Place of Ghostscript
        run: echo "GSDIR=$RUNNER_TOOL_CACHE/texmacs-gs-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Cache of Ghostscript
        id: gs-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GSDIR }}
          key: texmacs-gs-${{ matrix.arch }}-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/build-gs.sh') }}

      - name: Ghostscript
        if: steps.gs-cache.outputs.cache-hit != 'true'
        run: packages/build-gs.sh "$GSDIR" ${{ matrix.arch }} "$MIN_MACOS"

  app:
    needs: [deps, gs]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        gui: [cocoa, vue]
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - name: Place of the libraries
        run: echo "DEPS=$RUNNER_TOOL_CACHE/texmacs-deps-maxs-${{ matrix.arch }}" >> "$GITHUB_ENV"

      # the libraries made by the job deps (the same key)
      - name: The libraries
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS }}
          key: texmacs-deps-maxs-${{ matrix.arch }}-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/macos/build-deps.sh', 'src/misc/thorvg/build-thorvg.sh') }}
          fail-on-cache-miss: true

      # Ghostscript made by the job gs (the same key)
      - name: Place of Ghostscript
        run: echo "GSDIR=$RUNNER_TOOL_CACHE/texmacs-gs-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Ghostscript
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GSDIR }}
          key: texmacs-gs-${{ matrix.arch }}-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/build-gs.sh') }}
          fail-on-cache-miss: true

      - name: TeXmacs.app
        run: |
          packages/macos/build-ns-app.sh --deps "$DEPS" --gui ${{ matrix.gui }} \
            --scheme s7 --arch ${{ matrix.arch }} --min-macos "$MIN_MACOS" \
            --gs "$GSDIR"
          tar -C ../distr -czf ../distr/TeXmacs-${{ matrix.gui }}-${{ matrix.arch }}.tar.gz TeXmacs.app

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.gui }}-${{ matrix.arch }}
          path: distr/TeXmacs-${{ matrix.gui }}-${{ matrix.arch }}.tar.gz
          retention-days: 1

  dmg:
    needs: app
    strategy:
      fail-fast: false
      matrix:
        gui: [cocoa, vue]
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - uses: actions/download-artifact@v8
        with:
          pattern: app-${{ matrix.gui }}-*
          path: distr
          merge-multiple: true

      - name: Universal application and its disk image
        run: |
          for a in arm64 x86_64; do
            mkdir -p ../distr/$a
            tar -C ../distr/$a -xzf ../distr/TeXmacs-${{ matrix.gui }}-$a.tar.gz
          done
          version=$(plutil -extract CFBundleShortVersionString raw \
                      ../distr/arm64/TeXmacs.app/Contents/Info.plist)
          mkdir -p ../distr/macos
          # upload-artifact wants a path without ".."
          dmg="$(cd ../distr/macos && pwd)/TeXmacs-$version-${{ matrix.gui }}-universal.dmg"
          # the name and the identity of Upsilon (beside the stock TeXmacs
          # and the other interfaces), before the signature
          name=$(packages/macos/upsilon-identity.sh ../distr/arm64/TeXmacs.app ${{ matrix.gui }})
          packages/macos/upsilon-identity.sh ../distr/x86_64/TeXmacs.app ${{ matrix.gui }} > /dev/null
          packages/macos/merge-universal.sh ../distr/arm64/TeXmacs.app \
            ../distr/x86_64/TeXmacs.app "../distr/$name.app" "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "APP_NAME=$name" >> "$GITHUB_ENV"
          ls -l "$dmg"

      # the application of the disk image, with each architecture: a test
      # home, a document with big red text on the command line, and the
      # windows saved as PNGs (every 3 seconds with Cocoa, at each redraw
      # with Vue) until one shows the red text; the Vue port says whether
      # it draws with the GPU (the runners have no GPU of their own: the
      # software renderer of OpenGL, or MuPDF when there is no context)
      - name: Smoke test (the application of the disk image shows a document)
        run: |
          mnt=$(mktemp -d)
          # NOTE: again when it fails (Resource temporarily unavailable, on
          # the runners of GitHub)
          for i in 1 2 3 4 5; do
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG" && break
            [ $i = 5 ] && exit 1
            sleep $((i * 10))
          done
          status=0
          for a in arm64 x86_64; do
            home=$(mktemp -d)
            mkdir -p ../distr/snapshots/$a
            shots=$(cd ../distr/snapshots/$a && pwd)
            HOME="$home" TEXMACS_HOME_PATH="$home/.TeXmacs" \
              TEXMACS_NS_SNAPSHOT="$shots" TEXMACS_VUE_SNAPSHOT="$shots" \
              arch -$a "$mnt/$APP_NAME.app/Contents/MacOS/TeXmacs" \
              "$PWD/packages/macos/ci-colors.tm" > "$home/log.txt" 2>&1 &
            pid=$!
            ok=no
            for i in $(seq 1 60); do
              sleep 3
              kill -0 $pid 2> /dev/null || break
              ls "$shots"/window-*.png > /dev/null 2>&1 &&
                packages/macos/png-has-red.py "$shots"/window-*.png && { ok=yes; break; }
            done
            kill $pid 2> /dev/null || true
            wait $pid 2> /dev/null || true
            echo "== $a"
            grep "GPU" "$home/log.txt" || true
            tail -20 "$home/log.txt"
            [ $ok = yes ] || { echo "error: the document is not shown with $a"; status=1; }
          done
          hdiutil detach "$mnt"
          exit $status

      # the Ghostscript of the application of the disk image, with each
      # architecture: it runs alone and converts an EPS file with no gs of
      # the system, and TeXmacs runs it for an EPS image (#662)
      - name: Bundled tools (Ghostscript)
        run: |
          mnt=$(mktemp -d)
          for i in 1 2 3 4 5; do
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG" && break
            [ $i = 5 ] && exit 1
            sleep $((i * 10))
          done
          version=$(sed -n 's/^GS_VERSION=//p' packages/build-gs.sh)
          app="$mnt/$APP_NAME.app"
          ls -l "$app/Contents/Resources/share/TeXmacs/bin/gs"
          lipo -archs "$app/Contents/Resources/share/TeXmacs/bin/gs"
          ls "$app/Contents/Resources/share/TeXmacs/misc/licenses/ghostscript"
          status=0
          for a in arm64 x86_64; do
            echo "== $a"
            packages/bundled-tools/check.sh -r "$app/Contents/Resources/share/TeXmacs" \
              -v "$version" -- arch -$a "$app/Contents/MacOS/TeXmacs" -headless || status=1
          done
          hdiutil detach "$mnt"
          exit $status

      # failures of the Cocoa interface which used to be silent or to abort
      # TeXmacs (#621), and the focus of the console (#679): the cases are
      # listed at the head of the script; with the application of the disk
      # image (arm64, the architecture of the runner), about 4 minutes
      - name: Cocoa checks (tests/cocoa/check.sh)
        if: matrix.gui == 'cocoa'
        run: |
          mnt=$(mktemp -d)
          for i in 1 2 3 4 5; do
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG" && break
            [ $i = 5 ] && exit 1
            sleep $((i * 10))
          done
          status=0
          TM_TEST_HOME=$(mktemp -d) BIN="$mnt/$APP_NAME.app/Contents/MacOS/TeXmacs" \
            tests/cocoa/check.sh || status=$?
          [ $status = 0 ] || tail -40 tests/build/cocoa/*.log
          hdiutil detach "$mnt"
          exit $status

      # also when they pass: what the windows did (key, main, active)
      - uses: actions/upload-artifact@v7
        if: always() && matrix.gui == 'cocoa'
        with:
          name: cocoa-check-logs
          path: src/tests/build/cocoa/*.log
          if-no-files-found: warn

      # not zipped: the artifact downloads as the .dmg
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DMG }}
          archive: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots-${{ matrix.gui }}
          path: distr/snapshots
          if-no-files-found: ignore

  qt:
    name: macOS (Apple silicon, Qt 6)
    needs: gs
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt freetype libpng jpeg gnutls sqlite

      - name: Configure
        run: |
          B=$(brew --prefix)
          ./configure --with-scheme=s7 \
            QMAKE="$(brew --prefix qt)/bin/qmake" \
            CPPFLAGS="-I$(brew --prefix libpng)/include/libpng16 -I$B/include" \
            LDFLAGS="-L$(brew --prefix libpng)/lib -L$B/lib"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Run the regression suites
        run: ../.github/scripts/run-tests.sh TeXmacs/bin/texmacs.bin

      # the command line and the exit of TeXmacs after a script (#462), one
      # TeXmacs per case, under s7 (#562); fixes.yml runs them under Guile
      - name: The startup checks
        env:
          TM_TEST_TIMEOUT: 300
          TM_TEST_HOME: ${{ runner.temp }}/startup-home
        run: tests/startup/check.sh

      # Ghostscript for Apple silicon, made by the job gs
      - name: Ghostscript
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/texmacs-gs-arm64
          key: texmacs-gs-arm64-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/build-gs.sh') }}
          fail-on-cache-miss: true

      - name: Bundle
        run: |
          # bundle-libs.sh does not handle Homebrew's /opt/homebrew, so the
          # libraries, frameworks and plugins are deployed with macdeployqt
          GSDIR="$RUNNER_TOOL_CACHE/texmacs-gs-arm64"
          make MACOS_BUNDLE MACOS_DEPLOY=none GS_BUNDLE="$GSDIR/bin/gs" \
            GS_LICENSES="$GSDIR/share/licenses/ghostscript"
          "$(brew --prefix qt)/bin/macdeployqt" ../distr/TeXmacs.app
          # the name and the identity of Upsilon, signed again (ad hoc)
          name=$(packages/macos/upsilon-identity.sh ../distr/TeXmacs.app qt)
          rm -rf "../distr/$name.app"
          mv ../distr/TeXmacs.app "../distr/$name.app"
          codesign --force --deep -s - "../distr/$name.app"
          ditto -c -k --keepParent "../distr/$name.app" texmacs-qt-macos-arm64.zip
          # the Ghostscript of the application runs, with no gs of the system
          # (#662)
          app="../distr/$name.app"
          # (the Qt of macdeployqt has no offscreen platform)
          TM_CHECK_QPA= packages/bundled-tools/check.sh -r "$PWD/$app/Contents/Resources/share/TeXmacs" \
            -v "$(sed -n 's/^GS_VERSION=//p' packages/build-gs.sh)" -- "$PWD/$app/Contents/MacOS/TeXmacs"

      - uses: actions/upload-artifact@v4
        with:
          name: texmacs-qt-macos-arm64
          path: src/texmacs-qt-macos-arm64.zip
          retention-days: 14

  # The corresponding source of the programs of others which the packages
  # bring under the AGPL (Ghostscript) and the LGPL (Aspell, its dictionaries),
  # unmodified (but one line of mkromfs.c for the gs.exe of Windows, changed by
  # packages/build-gs.sh): their archives, checked against the SHA-256 of the build
  # scripts, kept as the assets of the release upsilon-sources (made once,
  # each file added when its version is new, none replaced). The packages
  # say where they are (misc/licenses/README.md of the TeXmacs folder, #662)
  sources:
    if: github.ref == 'refs/heads/upsilon_ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The release upsilon-sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag=upsilon-sources
          work="$RUNNER_TEMP/sources"
          mkdir -p "$work"
          cd "$work"
          gs_script="$GITHUB_WORKSPACE/src/packages/build-gs.sh"
          asp_script="$GITHUB_WORKSPACE/src/packages/windows/build-aspell.sh"
          gsv=$(sed -n 's/^GS_VERSION=//p' "$gs_script")
          gssha=$(sed -n 's/^GS_SHA256=//p' "$gs_script")
          aspv=$(sed -n 's/^ASPELL_VERSION=//p' "$asp_script")
          aspsha=$(sed -n 's/^ASPELL_SHA256=//p' "$asp_script")
          # file, url, SHA-256 of each archive
          {
            echo "ghostscript-$gsv.tar.gz https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs${gsv//./}/ghostscript-$gsv.tar.gz $gssha"
            echo "aspell-$aspv.tar.gz https://ftp.gnu.org/gnu/aspell/aspell-$aspv.tar.gz $aspsha"
            sed -n '/^DICTIONARIES="/,/^"/p' "$asp_script" | while read -r lang name sha; do
              case "$lang" in DICTIONARIES=*|'"'|'') continue;; esac
              echo "$name.tar.bz2 https://ftp.gnu.org/gnu/aspell/dict/$lang/$name.tar.bz2 $sha"
            done
          } > list.txt
          cat list.txt
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "TeXmacs Upsilon, sources of the programs of others" \
              --notes "The exact source archives of the programs of others which the packages of TeXmacs Upsilon bring: Ghostscript (GNU Affero General Public License 3), Aspell (GNU Lesser General Public License 2.1) and its dictionaries (their own free licenses), as the build scripts download them (packages/build-gs.sh, packages/windows/build-aspell.sh), not modified but for one line of mkromfs.c, which packages/build-gs.sh changes when it builds the gs.exe of the Windows packages (see the script). The sources of TeXmacs Upsilon itself are at https://github.com/${GH_REPO}. Written offer: the same archives, on request to the maintainer of the repository, for three years from the release of a package which has the program."
          fi
          have=$(gh release view "$tag" --json assets -q '.assets[].name')
          while read -r file url sha; do
            echo "$have" | grep -qx "$file" && { echo "$file: already there"; continue; }
            curl -sSfL --retry 3 -o "$file" "$url"
            [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$sha" ] ||
              { echo "error: wrong SHA-256 for $file"; exit 1; }
            gh release upload "$tag" "$file"
          done < list.txt

  release:
    # the files of macOS in the pre-release upsilon-latest; the Linux and
    # Windows packages are added to it by upsilon-linux-windows.yml. Each
    # workflow replaces and removes only its own files
    # (the sources of the programs of others first: a package is not published
    # before them, #662)
    needs: [dmg, qt, sources]
    if: always() && github.ref == 'refs/heads/upsilon_ci' && needs.dmg.result == 'success' && needs.sources.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TeXmacs-*-universal.dmg
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: needs.qt.result == 'success'
        with:
          name: texmacs-qt-macos-arm64
          path: dist

      - name: The pre-release upsilon-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls dist/*-cocoa-universal.dmg dist/*-vue-universal.dmg || { echo "error: a disk image is missing"; exit 1; }
          tag=upsilon-latest
          built="commit ${GITHUB_SHA:0:10}, $(date -u +%Y-%m-%d)"
          cat > notes.md << EOF
          The latest builds of TeXmacs Upsilon, an enhanced and bleeding-edge
          version of GNU TeXmacs with experimental features, from the branch
          \`upsilon_texmacs\`, with the S7 Scheme interpreter. Each file is
          replaced at each build of its platform, and its label names the
          commit it was built from (the macOS files: ${built}). The tag
          \`upsilon-latest\` does not follow the builds. The list of the
          files, with what each one is: https://mgubi.github.io/texmacs/

          * macOS (Apple silicon and Intel, macOS 13 or later):
            \`TeXmacs-*-cocoa-universal.dmg\`, the native interface (Cocoa),
            see [src/docs/ns-port.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/src/docs/ns-port.md);
            \`TeXmacs-*-vue-universal.dmg\`, the Vue interface, drawn by the
            GPU, see [vue-graphics-stack.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/src/docs/vue-graphics-stack.md);
            \`texmacs-qt-macos-arm64.zip\`, Qt 6, Apple silicon only.
            Signed ad hoc and not notarized (when they are, the program \`gs\`
            of the application will need the option of the hardened runtime
            for its own signature, as it is a program of its own). macOS refuses to open them the
            first time. Open the application from its context menu (Open),
            or allow it in System Settings > Privacy & Security, or remove
            the quarantine: \`xattr -dr com.apple.quarantine /Applications/TeXmacs.app\`
          * Linux (x86_64, built on Ubuntu 24.04):
            \`texmacs-linux-x86_64.tar.gz\` (Qt 6) and
            \`texmacs-vue-linux-x86_64.tar.gz\` (Vue): unpack, and run
            \`TEXMACS_PATH=\$PWD/TeXmacs TeXmacs/bin/texmacs\` in the folder of
            the archive. The Qt build uses the Qt 6 of the system (Ubuntu:
            \`sudo apt install libqt6svg6 qt6-qpa-plugins\`).
          * Windows (x86_64): \`texmacs-windows-x86_64.zip\` (Qt 6) and
            \`texmacs-vue-windows-x86_64.zip\` (Vue): unpack, and run
            \`TeXmacs-Windows\\bin\\texmacs.exe\`.

          Every package has Ghostscript (AGPL 3; on Windows also Aspell, LGPL
          2.1, with dictionaries): their licenses are in \`misc/licenses\` of
          the TeXmacs folder, and their exact source archives are the assets
          of the release [upsilon-sources](https://github.com/${GH_REPO}/releases/tag/upsilon-sources).

          The macOS files were built by [this run](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          label () {
            case "$1" in
              *-cocoa-universal.dmg) echo "macOS, Cocoa, universal ($built)" ;;
              *-vue-universal.dmg)   echo "macOS, Vue, universal ($built)" ;;
              texmacs-qt-macos-*)    echo "macOS, Qt 6, Apple silicon ($built)" ;;
            esac
          }
          files=()
          for f in dist/*; do files+=("$f#$(label "$(basename "$f")")"); done
          # The release is updated in place and its tag never moves: the token
          # of the workflow cannot create a tag on a commit whose workflow
          # files are no longer those of the branch (HTTP 403, it needs the
          # scope workflow), which happens as soon as a build is overtaken.
          # Deleting and recreating the release lost it at the first refusal.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            # the disk images of a former version: removed (the files of
            # Linux and Windows belong to the other workflow)
            for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do
              case "$old" in *.dmg) [ -e "dist/$old" ] || gh release delete-asset "$tag" "$old" --yes ;; esac
            done
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --prerelease \
              --title "TeXmacs Upsilon, latest builds" --notes-file notes.md ||
              { echo "error: create the release $tag once by hand (gh release create with the scope workflow)"; exit 1; }
          fi
