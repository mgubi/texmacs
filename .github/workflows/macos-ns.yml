# TeXmacs with the native interface of macOS (NS/Cocoa, doc/ns-port.md), as
# one disk image for Apple silicon and Intel which runs on macOS 12 and
# later:
#   * app (for arm64 and x86_64, the latter under Rosetta): the libraries
#     which do not come with macOS (GMP, libltdl, libpng, FreeType, Guile
#     1.8) built for macOS 12 with packages/macos/build-deps.sh (cached; the
#     ones of Homebrew only run on the version of macOS of the runner), then
#     TeXmacs.app with packages/macos/build-ns-app.sh;
#   * dmg: both applications merged (packages/macos/merge-universal.sh),
#     its disk image, and a check that the application of the disk image
#     opens a document given on the command line with each architecture and
#     shows its colors (packages/macos/ci-colors.tm, png-has-red.py). The
#     disk image and the snapshots of the windows are artifacts of the run;
#   * release (on ns_ci only): the disk image published as the pre-release
#     cocoa-latest of the repository, replaced at each build (its tag moved
#     to the commit built), so that its page and its download stay the same:
#     https://github.com/<owner>/<repo>/releases/tag/cocoa-latest
#
# The application is signed ad hoc and not notarized: Gatekeeper rejects it
# on another machine until the quarantine is removed,
#   xattr -dr com.apple.quarantine /Applications/TeXmacs.app
#
# It runs on the branch ns_ci only: the work goes on in wip_other_guis,
# which triggers nothing, and a state is built by moving ns_ci to it,
#   git push origin wip_other_guis:ns_ci
# (or by hand, from the Actions tab, on any branch)

name: macOS (Cocoa)

on:
  push:
    branches: [ns_ci]
  workflow_dispatch:

env:
  MIN_MACOS: "12.0"

jobs:
  app:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - name: Place of the libraries
        run: echo "DEPS=$RUNNER_TOOL_CACHE/texmacs-deps-${{ matrix.arch }}" >> "$GITHUB_ENV"

      # the libraries: again only when build-deps.sh (which has their
      # versions) or the version of macOS change
      - name: Cache of the libraries
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS }}
          key: texmacs-deps-${{ matrix.arch }}-${{ env.MIN_MACOS }}-${{ hashFiles('src/packages/macos/build-deps.sh') }}

      - name: Libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: packages/macos/build-deps.sh "$DEPS" ${{ matrix.arch }} "$MIN_MACOS"

      - name: TeXmacs.app
        run: |
          packages/macos/build-ns-app.sh --deps "$DEPS" \
            --arch ${{ matrix.arch }} --min-macos "$MIN_MACOS"
          tar -C ../distr -czf ../distr/TeXmacs-${{ matrix.arch }}.tar.gz TeXmacs.app

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.arch }}
          path: distr/TeXmacs-${{ matrix.arch }}.tar.gz
          retention-days: 1

  dmg:
    needs: app
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Rosetta
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: distr
          merge-multiple: true

      - name: Universal application and its disk image
        run: |
          for a in arm64 x86_64; do
            mkdir -p ../distr/$a
            tar -C ../distr/$a -xzf ../distr/TeXmacs-$a.tar.gz
          done
          version=$(plutil -extract CFBundleShortVersionString raw \
                      ../distr/arm64/TeXmacs.app/Contents/Info.plist)
          mkdir -p ../distr/macos
          # upload-artifact wants a path without ".."
          dmg="$(cd ../distr/macos && pwd)/TeXmacs-$version-universal.dmg"
          packages/macos/merge-universal.sh ../distr/arm64/TeXmacs.app \
            ../distr/x86_64/TeXmacs.app ../distr/TeXmacs.app "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          ls -l "$dmg"

      # the application of the disk image, with each architecture: a test
      # home, a document with big red text on the command line, and the
      # windows saved as PNGs every 3 seconds until one shows the red text
      - name: Smoke test (the application of the disk image shows a document)
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          status=0
          for a in arm64 x86_64; do
            home=$(mktemp -d)
            mkdir -p ../distr/snapshots/$a
            shots=$(cd ../distr/snapshots/$a && pwd)
            HOME="$home" TEXMACS_HOME_PATH="$home/.TeXmacs" TEXMACS_NS_SNAPSHOT="$shots" \
              arch -$a "$mnt/TeXmacs.app/Contents/MacOS/TeXmacs" \
              "$PWD/packages/macos/ci-colors.tm" > "$home/log.txt" 2>&1 &
            pid=$!
            ok=no
            for i in $(seq 1 60); do
              sleep 3
              kill -0 $pid 2> /dev/null || break
              ls "$shots"/window-*.png > /dev/null 2>&1 &&
                packages/macos/png-has-red.py "$shots"/window-*.png && { ok=yes; break; }
            done
            kill $pid 2> /dev/null || true
            wait $pid 2> /dev/null || true
            echo "== $a"
            tail -20 "$home/log.txt"
            [ $ok = yes ] || { echo "error: the document is not shown with $a"; status=1; }
          done
          hdiutil detach "$mnt"
          exit $status

      # not zipped: the artifact downloads as the .dmg
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DMG }}
          archive: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots
          path: distr/snapshots
          if-no-files-found: ignore

  release:
    needs: dmg
    if: github.ref == 'refs/heads/ns_ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TeXmacs-*-universal.dmg
          path: dist
          merge-multiple: true

      - name: The pre-release cocoa-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          [ -f "$dmg" ] || { echo "error: no disk image"; exit 1; }
          tag=cocoa-latest
          cat > notes.md << EOF
          The latest build of GNU TeXmacs with the native interface of macOS
          (Cocoa), from the branch \`wip_other_guis\` (commit
          ${GITHUB_SHA:0:10}, $(date -u +%Y-%m-%d)); it is replaced at each
          build. Work in progress: see [doc/ns-port.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/doc/ns-port.md).

          * One application for Apple silicon and Intel, macOS 12 or later.
          * Signed ad hoc and not notarized: macOS refuses to open it the
            first time. Open it from the context menu (Open), or allow it
            in System Settings > Privacy & Security, or remove the
            quarantine: \`xattr -dr com.apple.quarantine /Applications/TeXmacs.app\`
          * The PDF is written by TeXmacs itself; Ghostscript is only needed
            for PostScript.

          Built by [this run](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" "$dmg" --target "$GITHUB_SHA" --prerelease \
            --title "TeXmacs for macOS (Cocoa), latest build" --notes-file notes.md
